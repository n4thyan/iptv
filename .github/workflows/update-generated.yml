name: Build Kodi playlist and EPG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-generated.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: iptv-generated
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -v

      - name: Build cleaned English playlist
        run: >-
          python scripts/build_playlist.py
          --extra-group UK=https://iptv-org.github.io/iptv/countries/uk.m3u

      - name: Build optional cleaned UK playlist
        run: >-
          python scripts/build_playlist.py
          --source https://iptv-org.github.io/iptv/countries/uk.m3u
          --output output/uk.m3u
          --ids output/uk-channel_ids.txt
          --stats output/uk-playlist-stats.json

      - name: Check out IPTV-org EPG tooling
        run: git clone --depth 1 --branch master https://github.com/iptv-org/epg.git vendor/epg

      - name: Install EPG grabber dependencies
        working-directory: vendor/epg
        env:
          HUSKY: "0"
        run: npm ci

      - name: Match playlist IDs to EPG sources
        run: >-
          python scripts/build_epg_channels.py
          --ids output/channel_ids.txt
          --sites-root vendor/epg/sites
          --output output/epg.channels.xml
          --coverage output/epg-coverage.txt

      - name: Split EPG request into memory-safe chunks
        run: >-
          python scripts/split_epg_channels.py
          --input output/epg.channels.xml
          --output-dir output/epg-chunks
          --size 20
          --manifest output/epg-chunks.json

      - name: Grab programme guide chunks
        working-directory: vendor/epg
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/output/epg-fragments"
          mkdir -p "$GITHUB_WORKSPACE/output/epg-retry"
          : > "$GITHUB_WORKSPACE/output/epg-failures.txt"

          primary_success=0
          primary_failed=0
          retry_success=0
          retry_failed=0

          for channels in "$GITHUB_WORKSPACE"/output/epg-chunks/chunk-*.channels.xml; do
            chunk="$(basename "$channels" .channels.xml)"
            output="$GITHUB_WORKSPACE/output/epg-fragments/${chunk}.xml"
            echo "=== ${chunk} ==="

            if npm run grab -- \
              --channels="$channels" \
              --output="$output" \
              --days=2 \
              --maxConnections=4 \
              --timeout=20000 && [ -s "$output" ]; then
              primary_success=$((primary_success + 1))
              continue
            fi

            primary_failed=$((primary_failed + 1))
            rm -f "$output"
            echo "${chunk} failed as a batch; retrying each channel separately"

            retry_dir="$GITHUB_WORKSPACE/output/epg-retry/${chunk}"
            python "$GITHUB_WORKSPACE/scripts/split_epg_channels.py" \
              --input "$channels" \
              --output-dir "$retry_dir" \
              --size 1 \
              --manifest "$retry_dir/manifest.json"

            for retry_channels in "$retry_dir"/chunk-*.channels.xml; do
              retry_name="$(basename "$retry_channels" .channels.xml)"
              retry_output="$GITHUB_WORKSPACE/output/epg-fragments/${chunk}-${retry_name}.xml"
              echo "--- ${chunk}/${retry_name} ---"

              if npm run grab -- \
                --channels="$retry_channels" \
                --output="$retry_output" \
                --days=2 \
                --maxConnections=2 \
                --timeout=20000 && [ -s "$retry_output" ]; then
                retry_success=$((retry_success + 1))
              else
                status=$?
                retry_failed=$((retry_failed + 1))
                rm -f "$retry_output"
                printf '%s/%s\texit=%s\n' "$chunk" "$retry_name" "$status" \
                  >> "$GITHUB_WORKSPACE/output/epg-failures.txt"
              fi
            done
          done

          cat > "$GITHUB_WORKSPACE/output/epg-chunk-summary.txt" <<EOF
          primary_chunk_size=20
          successful_primary_chunks=${primary_success}
          failed_primary_chunks=${primary_failed}
          successful_retry_channels=${retry_success}
          failed_retry_channels=${retry_failed}
          EOF

          echo "Primary chunks: ${primary_success} successful, ${primary_failed} retried"
          echo "Fallback channels: ${retry_success} successful, ${retry_failed} failed"

          if ! compgen -G "$GITHUB_WORKSPACE/output/epg-fragments/*.xml" > /dev/null; then
            echo "No EPG fragments were generated successfully."
            exit 1
          fi

      - name: Merge programme guide chunks
        run: >-
          python scripts/merge_xmltv.py
          "output/epg-fragments/chunk-*.xml"
          --output output/guide.xml

      - name: Summarize programme guide
        run: >-
          python scripts/xmltv_stats.py
          output/guide.xml
          --output output/guide-stats.json

      - name: Compress guide
        run: gzip -9 -c output/guide.xml > output/guide.xml.gz

      - name: Validate generated outputs
        run: |
          test -s output/english.m3u
          test -s output/uk.m3u
          test -s output/guide.xml.gz
          test -s output/guide-stats.json
          grep -q '^#EXTM3U' output/english.m3u
          grep -q '^#EXTM3U' output/uk.m3u
          grep -q 'group-title="[^"]*UK' output/english.m3u
          grep -q '<tv' output/guide.xml
          grep -q '<programme ' output/guide.xml
          echo "english_playlist_bytes=$(wc -c < output/english.m3u)"
          echo "uk_playlist_bytes=$(wc -c < output/uk.m3u)"
          echo "guide_xml_bytes=$(wc -c < output/guide.xml)"
          echo "guide_gzip_bytes=$(wc -c < output/guide.xml.gz)"
          echo "programmes=$(grep -c '<programme ' output/guide.xml || true)"
          cat output/guide-stats.json

      - name: Prepare generated branch
        run: |
          mkdir -p publish
          cp output/english.m3u publish/english.m3u
          cp output/uk.m3u publish/uk.m3u
          cp output/guide.xml.gz publish/guide.xml.gz
          cp output/guide-stats.json publish/guide-stats.json
          cp output/epg-coverage.txt publish/epg-coverage.txt
          cp output/playlist-stats.json publish/playlist-stats.json
          cp output/uk-playlist-stats.json publish/uk-playlist-stats.json
          cp output/epg-chunk-summary.txt publish/epg-chunk-summary.txt
          cp output/epg-failures.txt publish/epg-failures.txt
          printf 'Generated: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > publish/last-update.txt

      - name: Publish generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          git init
          git checkout -b generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Refresh Kodi playlist and EPG"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin generated
