name: Test IPTV tools

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q scripts tools tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
