name: Verify generated Kodi files

on:
  workflow_run:
    workflows:
      - Build Kodi playlist and EPG
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out generated branch
        uses: actions/checkout@v4
        with:
          ref: generated

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify playlist and XMLTV guide
        run: |
          python - <<'PY'
          import gzip
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          english = Path("english.m3u")
          uk = Path("uk.m3u")
          guide = Path("guide.xml.gz")
          coverage = Path("epg-coverage.txt")
          playlist_stats_path = Path("playlist-stats.json")
          uk_stats_path = Path("uk-playlist-stats.json")
          guide_stats_path = Path("guide-stats.json")
          chunk_summary = Path("epg-chunk-summary.txt")
          failures = Path("epg-failures.txt")
          update = Path("last-update.txt")

          required = [
              english,
              uk,
              guide,
              coverage,
              playlist_stats_path,
              uk_stats_path,
              guide_stats_path,
              chunk_summary,
              failures,
              update,
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing generated files: {', '.join(missing)}")
          empty_required = [
              str(path)
              for path in [
                  english,
                  uk,
                  guide,
                  coverage,
                  playlist_stats_path,
                  uk_stats_path,
                  guide_stats_path,
                  chunk_summary,
                  update,
              ]
              if path.stat().st_size == 0
          ]
          if empty_required:
              raise SystemExit(f"empty generated files: {', '.join(empty_required)}")

          def playlist_count(path: Path, minimum: int) -> tuple[int, str]:
              text = path.read_text(encoding="utf-8-sig")
              if not text.startswith("#EXTM3U"):
                  raise SystemExit(f"{path} does not start with #EXTM3U")
              if "x-tvg-url=" not in text.splitlines()[0]:
                  raise SystemExit(f"{path} is missing its embedded EPG URL")
              count = sum(1 for line in text.splitlines() if line.startswith("#EXTINF"))
              if count < minimum:
                  raise SystemExit(f"{path} unexpectedly small: {count} channels")
              return count, text

          def group_count(text: str, group_name: str) -> int:
              count = 0
              for line in text.splitlines():
                  if not line.startswith("#EXTINF"):
                      continue
                  match = re.search(r'group-title="([^"]*)"', line)
                  if not match:
                      continue
                  groups = {part.strip().casefold() for part in match.group(1).split(";") if part.strip()}
                  if group_name.casefold() in groups:
                      count += 1
              return count

          english_channels, english_text = playlist_count(english, 1000)
          uk_channels, _ = playlist_count(uk, 10)
          uk_group_channels = group_count(english_text, "UK")
          if uk_group_channels < 1:
              raise SystemExit("english.m3u does not contain the generated UK channel group")

          with gzip.open(guide, "rb") as handle:
              root = ET.parse(handle).getroot()
          if root.tag != "tv":
              raise SystemExit(f"guide root is {root.tag!r}, expected 'tv'")
          guide_channels = len(root.findall("channel"))
          programmes = len(root.findall("programme"))
          programme_channels = {
              programme.attrib.get("channel", "")
              for programme in root.findall("programme")
              if programme.attrib.get("channel")
          }
          if guide_channels < 1 or programmes < 1:
              raise SystemExit(
                  f"guide has insufficient data: {guide_channels} channels, {programmes} programmes"
              )

          playlist_stats = json.loads(playlist_stats_path.read_text(encoding="utf-8"))
          if int(playlist_stats.get("entries_kept", 0)) != english_channels:
              raise SystemExit(
                  "playlist-stats.json entries_kept does not match english.m3u"
              )
          uk_group_stats = playlist_stats.get("extra_groups", {}).get("UK", {})
          tagged_uk = int(uk_group_stats.get("entries_tagged", 0) or 0)
          if tagged_uk < 1:
              raise SystemExit("playlist-stats.json reports no generated UK group members")
          if uk_group_channels < tagged_uk:
              raise SystemExit(
                  "english.m3u contains fewer UK-group channels than playlist-stats.json reports"
              )

          uk_stats = json.loads(uk_stats_path.read_text(encoding="utf-8"))
          if int(uk_stats.get("entries_kept", 0)) != uk_channels:
              raise SystemExit(
                  "uk-playlist-stats.json entries_kept does not match uk.m3u"
              )

          guide_stats = json.loads(guide_stats_path.read_text(encoding="utf-8"))
          if int(guide_stats.get("channel_elements", -1)) != guide_channels:
              raise SystemExit("guide-stats.json channel count does not match guide.xml.gz")
          if int(guide_stats.get("programme_elements", -1)) != programmes:
              raise SystemExit("guide-stats.json programme count does not match guide.xml.gz")
          if int(guide_stats.get("channels_with_programmes", -1)) != len(programme_channels):
              raise SystemExit("guide-stats.json programme-channel count does not match guide.xml.gz")

          coverage_text = coverage.read_text(encoding="utf-8", errors="replace")
          if "matched EPG ids:" not in coverage_text or "UNMATCHED IDS" not in coverage_text:
              raise SystemExit("EPG coverage report is incomplete")

          print(f"english_playlist_channels={english_channels}")
          print(f"uk_playlist_channels={uk_channels}")
          print(f"english_uk_group_channels={uk_group_channels}")
          print(f"guide_channels={guide_channels}")
          print(f"channels_with_programmes={len(programme_channels)}")
          print(f"programmes={programmes}")
          print(chunk_summary.read_text(encoding="utf-8").strip())
          if failures.stat().st_size:
              print("Some isolated EPG channels failed; see epg-failures.txt")
          else:
              print("No isolated EPG channel failures recorded")
          print(update.read_text(encoding="utf-8").strip())
          PY
